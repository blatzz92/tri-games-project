<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TRİ-GAMES</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe id="gorunum"></iframe>

    <script>
        var RAW_URL = "https://raw.githubusercontent.com/blatzz92/tri-games-project/main/index.html";

        function koduGetir() {
            var xhr;
            if (window.XMLHttpRequest) {
                xhr = new XMLHttpRequest();
            } else {
                xhr = new ActiveXObject("Microsoft.XMLHTTP");
            }
            
            var url = RAW_URL + "?t=" + new Date().getTime();

            xhr.open("GET", url, true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var iframe = document.getElementById("gorunum");
                    var doc = iframe.contentDocument || iframe.contentWindow.document;
                    doc.open();
                    doc.write(xhr.responseText);
                    doc.close();
                }
            };
            xhr.send();
        }

        window.onload = koduGetir;
    </script>

</body>
</html>
