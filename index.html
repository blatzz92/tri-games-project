<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Tri-Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; padding: 15px; font-size: 13px; }
    
    header { border-bottom: 2px solid #ff9900; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    h1 { color: #ff9900; font-size: 22px; font-weight: bold; }
    
    .header-right { display: flex; align-items: center; gap: 10px; }
    .version-tag { background: #222; color: #ff9900; border: 1px solid #ff9900; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }

    /* Ruffle Toggle Switch Stili */
    .ruffle-toggle { background: #2a2a2a; border: 1px solid #444; color: #ccc; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .ruffle-toggle.active { background: #28a745; color: #fff; border-color: #28a745; }

    .controls { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
    input[type="text"] { background: #222; border: 1px solid #444; color: #fff; padding: 6px 10px; font-size: 13px; width: 220px; border-radius: 3px; }
    
    .tab-btn { background: #2a2a2a; color: #ccc; border: 1px solid #444; padding: 6px 12px; cursor: pointer; border-radius: 3px; font-size: 12px; }
    .tab-btn.active { background: #ff9900; color: #000; font-weight: bold; border-color: #ff9900; }

    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 15px; min-height: 280px; }
    .game-card { background: #222; border: 1px solid #333; padding: 10px; text-align: center; border-radius: 4px; cursor: pointer; }
    .game-card:hover { border-color: #ff9900; background: #2a2a2a; }
    .game-title { color: #fff; font-weight: bold; font-size: 13px; word-break: break-word; }
    .game-category { color: #888; font-size: 10px; margin-top: 4px; }

    .pagination { display: flex; justify-content: center; gap: 5px; margin-top: 10px; }
    .page-btn { background: #222; border: 1px solid #444; color: #fff; padding: 5px 10px; cursor: pointer; border-radius: 3px; font-size: 12px; }
    .page-btn.active { background: #ff9900; color: #000; font-weight: bold; border-color: #ff9900; }

    #player-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; flex-direction: column; z-index: 999; }
    .player-box { background: #000; border: 2px solid #ff9900; padding: 10px; width: 820px; text-align: right; }
    .close-btn { background: #d9534f; color: #fff; border: none; padding: 5px 12px; cursor: pointer; font-weight: bold; margin-bottom: 5px; }
    #swf-container { width: 800px; height: 600px; background: #111; position: relative; }

    #maintenance-screen { display: none; text-align: center; margin-top: 100px; }
    #maintenance-screen h2 { color: #d9534f; font-size: 24px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div id="maintenance-screen">
    <h2>SITE SU ANDA AKTIF DEGIL</h2>
    <p>Site bakımdadır yada güncelleniyor.</p>
  </div>

  <div id="main-content">
    <header>
      <h1>Tri-Games</h1>
      <div class="header-right">
        <!-- Ruffle Aç/Kapat Toggle Butonu -->
        <button id="ruffle-toggle-btn" class="ruffle-toggle" onclick="toggleRuffle()">Ruffle: KAPALI</button>
        <span class="version-tag" id="version-display">Versiyon:unkown</span>
      </div>
    </header>

    <div class="controls">
      <input type="text" id="search-input" placeholder="Oyun ara..." oninput="onSearch()">
      <button class="tab-btn active" onclick="setCategory('hepsi', event)">Tum Oyunlar</button>
      <button class="tab-btn" onclick="setCategory('basarili', event)">Basarili Oyunlar</button>
      <button class="tab-btn" onclick="setCategory('populer', event)">En Populer Oyunlar</button>
      <button class="tab-btn" onclick="setCategory('non-swf', event)" style="border-color: #28a745; color: #28a745;">NON-SWF Oyunlar</button>
    </div>

    <div class="game-grid" id="game-grid"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <!-- Oyun Oynatıcı / Web Port Modal Penceresi -->
  <div id="player-modal">
    <div class="player-box">
      <button class="close-btn" onclick="closeGame()">X KAPAT</button>
      <div id="swf-container"></div>
    </div>
  </div>

  <script>
    var gamesData = [];
    var currentPage = 1;
    var itemsPerPage = 15;
    var currentCategory = 'hepsi';
    var searchQuery = '';
    var ruffleActive = false;

    // Ruffle Toggle ve Sayfayı Yeniden Yükleme Sistemi
    function toggleRuffle() {
      ruffleActive = !ruffleActive;
      if (ruffleActive) {
        localStorage.setItem("ruffle_status", "true");
        location.reload();
      } else {
        localStorage.removeItem("ruffle_status");
        location.reload();
      }
    }

    function initLauncher() {
      var savedRuffle = localStorage.getItem("ruffle_status");
      if (savedRuffle === "true") {
        ruffleActive = true;
        var btn = document.getElementById("ruffle-toggle-btn");
        btn.className = "ruffle-toggle active";
        btn.innerText = "Ruffle: ACIK";

        var script = document.createElement("script");
        script.id = "ruffle-script";
        script.src = "https://unpkg.com/@ruffle-rs/ruffle";
        document.head.appendChild(script);
      }

      var fs, path;
      try {
        fs = require('fs');
        path = require('path');
      } catch(e) {
        return;
      }

      var rootDir = process.cwd();

      try {
        var settingsPath = path.join(rootDir, 'settings.json');
        if (fs.existsSync(settingsPath)) {
          var rawData = fs.readFileSync(settingsPath, 'utf8');
          if (rawData.charCodeAt(0) === 0xFEFF) rawData = rawData.slice(1);
          var settings = JSON.parse(rawData);
          if (settings.versiyon) {
            document.getElementById("version-display").innerText = "Versiyon: " + settings.versiyon;
          }
          if (settings.aktifmi === false) {
            document.getElementById("main-content").style.display = "none";
            document.getElementById("maintenance-screen").style.display = "block";
            return;
          }
        }
      } catch(err) {}

      // 1. SWF Oyun Klasörleri Taranıyor
      var categoryFolders = [
        { folder: path.join(rootDir, 'swf games', 'best games'), cat: 'basarili', sub: 'best games' },
        { folder: path.join(rootDir, 'swf games', 'popular games'), cat: 'populer', sub: 'popular games' },
        { folder: path.join(rootDir, 'swf games', 'other games'), cat: 'diger', sub: 'other games' }
      ];

      for (var i = 0; i < categoryFolders.length; i++) {
        var item = categoryFolders[i];
        try {
          if (fs.existsSync(item.folder)) {
            var files = fs.readdirSync(item.folder);
            for (var j = 0; j < files.length; j++) {
              var fileName = files[j];
              if (fileName.toLowerCase().indexOf(".swf") !== -1) {
                var cleanName = fileName.replace(/\.[^/.]+$/, "").replace(/_/g, " ");
                var webPath = 'swf games/' + item.sub + '/' + fileName;

                gamesData.push({
                  name: cleanName.charAt(0).toUpperCase() + cleanName.slice(1),
                  file: webPath,
                  category: item.cat,
                  type: 'swf'
                });
              }
            }
          }
        } catch(e) {}
      }

      // 2. NON-SWF Klasöründeki .html ve .htm Dosyaları Kesin Tarama
      var nonSwfFolder = path.join(rootDir, 'non-swf games');
      try {
        if (fs.existsSync(nonSwfFolder)) {
          var nonFiles = fs.readdirSync(nonSwfFolder);
          for (var k = 0; k < nonFiles.length; k++) {
            var nf = nonFiles[k];
            var nfLower = nf.toLowerCase();
            // .html veya .htm uzantı kontrolü (uzantı ile bitip bitmediğine bakıyoruz)
            if (nfLower.endsWith('.html') || nfLower.endsWith('.htm')) {
              var cleanNfName = nf.replace(/\.[^/.]+$/, "").replace(/_/g, " ");
              var webNfPath = 'non-swf games/' + nf;

              gamesData.push({
                name: cleanNfName.charAt(0).toUpperCase() + cleanNfName.slice(1),
                file: webNfPath,
                category: 'non-swf',
                type: 'html'
              });
            }
          }
        }
      } catch(e) {
        console.log("Non-SWF klasör okuma hatası:", e);
      }

      renderGrid();
    }

    function getFilteredGames() {
      var filtered = [];
      for (var i = 0; i < gamesData.length; i++) {
        var g = gamesData[i];
        // Kategori filtresi: 'hepsi' ise tümü, 'non-swf' ise sadece non-swf, diğerleri kendi kategorisi
        var matchCategory = (currentCategory === 'hepsi' || g.category === currentCategory);
        var matchSearch = g.name.toLowerCase().indexOf(searchQuery.toLowerCase()) !== -1;
        if (matchCategory && matchSearch) {
          filtered.push(g);
        }
      }
      return filtered;
    }

    function renderGrid() {
      var filtered = getFilteredGames();
      var grid = document.getElementById("game-grid");
      grid.innerHTML = "";

      var startIndex = (currentPage - 1) * itemsPerPage;
      var endIndex = startIndex + itemsPerPage;
      var pageGames = filtered.slice(startIndex, endIndex);

      if (pageGames.length === 0) {
        grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; padding:20px; color:#888;'>Bu kategoride oyun bulunamadı!</p>";
      } else {
        for (var i = 0; i < pageGames.length; i++) {
          var game = pageGames[i];
          var card = document.createElement("div");
          card.className = "game-card";
          
          card.onclick = (function(gObj) {
            return function() {
              playGame(gObj.file, gObj.type);
            };
          })(game);

          var catText = "[Genel]";
          if (game.category === "basarili") catText = "[Basarili]";
          if (game.category === "populer") catText = "[Populer]";
          if (game.category === "non-swf") catText = "[Non-SWF]";

          card.innerHTML = "<div class='game-title'>" + game.name + "</div><div class='game-category'>" + catText + "</div>";
          grid.appendChild(card);
        }
      }

      renderPagination(filtered.length);
    }

    function renderPagination(totalItems) {
      var totalPages = Math.ceil(totalItems / itemsPerPage);
      var container = document.getElementById("pagination");
      container.innerHTML = "";

      if (totalPages <= 1) return;

      for (var i = 1; i <= totalPages; i++) {
        var btn = document.createElement("button");
        btn.className = "page-btn" + (i === currentPage ? " active" : "");
        btn.innerText = i;
        btn.onclick = (function(pageNum) {
          return function() {
            currentPage = pageNum;
            renderGrid();
          };
        })(i);
        container.appendChild(btn);
      }
    }

    function setCategory(cat, evt) {
      currentCategory = cat;
      currentPage = 1;
      var btns = document.querySelectorAll(".tab-btn");
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove("active");
      }
      evt.target.classList.add("active");
      renderGrid();
    }

    function onSearch() {
      searchQuery = document.getElementById("search-input").value;
      currentPage = 1;
      renderGrid();
    }

    function playGame(filePath, fileType) {
      var container = document.getElementById("swf-container");
      
      if (fileType === 'html') {
        container.innerHTML = '<iframe src="' + filePath + '" width="100%" height="100%" style="border:none;"></iframe>';
      } else {
        if (ruffleActive) {
          container.innerHTML = '<object data="' + filePath + '" width="100%" height="100%">' +
            '<embed src="' + filePath + '" width="100%" height="100%"></embed>' +
            '</object>';
        } else {
          container.innerHTML = '<object width="100%" height="100%">' +
            '<param name="movie" value="' + filePath + '">' +
            '<embed src="' + filePath + '" width="100%" height="100%"></embed>' +
            '</object>';
        }
      }

      document.getElementById("player-modal").style.display = "flex";
    }

    function closeGame() {
      var container = document.getElementById("swf-container");
      container.innerHTML = "";
      document.getElementById("player-modal").style.display = "none";
    }

    window.onload = function() {
      initLauncher();
    };
  </script>
</body>
</html>
